name: Test backend & build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests (failures shown as annotations)
        run: |
          set +e
          python -m pytest -q --tb=line -rfE -p no:warnings > pytest.txt 2>&1
          code=$?
          cat pytest.txt
          if [ $code -ne 0 ]; then
            grep -E "^(FAILED|ERROR)|^/|^E |Error" pytest.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install JS dependencies
        run: |
          npm install
          npx expo install --fix
      - name: Type-check (reported as warnings; Metro builds without it)
        run: |
          npx tsc --noEmit --pretty false > tsc.txt || true
          cat tsc.txt
          sed -E 's/^([^()]+)\(([0-9]+),([0-9]+)\): (.*)$/::warning file=mobile\/\1,line=\2,col=\3::\4/' tsc.txt
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build release APK (debug-signed, for testing)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk kite-algo.apk
      - name: Push APK to apk branch (no artifact storage needed)
        run: |
          mkdir -p /tmp/apkpub && cp kite-algo.apk /tmp/apkpub/ && cd /tmp/apkpub
          git init -q -b apk
          git add kite-algo.apk
          git -c user.name="apk-bot" -c user.email="apk-bot@users.noreply.github.com" commit -q -m "APK from run ${{ github.run_id }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
      - name: Publish to "apk-latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest kite-algo.apk --prerelease --title "Kite Algo APK (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Debug-signed test build: allow 'Install unknown apps' to install." --target "$GITHUB_SHA"
